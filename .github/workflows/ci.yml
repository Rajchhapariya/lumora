name: CI

# Builds the app and runs the unit tests on every push and pull request.
# The build is unsigned: signing keys are never stored in this repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Gradle wrapper jar
        run: sh scripts/fetch-wrapper.sh

      - name: Run unit tests and build the release APK
        run: ./gradlew --console=plain testDebugUnitTest :app:assembleRelease

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
